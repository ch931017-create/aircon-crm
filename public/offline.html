<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오프라인 상태</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu",
          "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        padding: 40px 24px;
        text-align: center;
        max-width: 420px;
      }

      .icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 24px;
        background: #fee2e2;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
      }

      h1 {
        font-size: 24px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 12px;
      }

      p {
        font-size: 14px;
        color: #6b7280;
        line-height: 1.6;
        margin-bottom: 24px;
      }

      .tips {
        background: #f9fafb;
        border-radius: 16px;
        padding: 20px;
        text-align: left;
        margin-bottom: 24px;
      }

      .tips h3 {
        font-size: 13px;
        font-weight: 600;
        color: #374151;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .tips ul {
        list-style: none;
        font-size: 13px;
        color: #6b7280;
      }

      .tips li {
        margin-bottom: 8px;
      }

      .tips li:before {
        content: "→ ";
        color: #2563eb;
        font-weight: 600;
        margin-right: 6px;
      }

      button {
        width: 100%;
        padding: 12px 24px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }

      button:hover {
        background: #1d4ed8;
      }

      button:active {
        background: #1e40af;
      }

      .footer {
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid #e5e7eb;
        font-size: 12px;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>인터넷 연결이 끊어졌습니다</h1>
      <p>현재 오프라인 상태입니다. 와이파이나 모바일 데이터에 연결한 후 다시 시도해주세요.</p>

      <div class="tips">
        <h3>도움말</h3>
        <ul>
          <li>와이파이 연결 확인</li>
          <li>모바일 데이터 활성화 확인</li>
          <li>경비행기 모드 비활성화</li>
          <li>라우터 재부팅 시도</li>
        </ul>
      </div>

      <button onclick="location.reload()">다시 시도</button>

      <div class="footer">
        <p>에어컨 콜풀 CRM • 오프라인 상태</p>
      </div>
    </div>
  </body>
</html>
